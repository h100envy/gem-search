name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m pip install -r requirements-desktop.txt
      - run: npm ci --ignore-scripts
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/http_extension_smoke.py
      - run: python3 tests/http_bridge_smoke.py
      - run: npm test
      - run: python3 scripts/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: gem-search-extension
          path: dist/gem-search-extension.zip
