<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Gem Search - Let curiosity crawl</title>
  <desc id="desc">A large rainbow spider on a midnight background. A local-first browser companion powered by JEV, crawler and four Grok perspectives.</desc>
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff628d"/><stop offset=".18" stop-color="#ffac66"/><stop offset=".36" stop-color="#ffe67a"/><stop offset=".52" stop-color="#a7f68b"/><stop offset=".68" stop-color="#63e8e8"/><stop offset=".84" stop-color="#9298ff"/><stop offset="1" stop-color="#e993ff"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6b96"/><stop offset=".2" stop-color="#ffbd73"/><stop offset=".4" stop-color="#cbf18e"/><stop offset=".6" stop-color="#71ece6"/><stop offset=".8" stop-color="#9a9aff"/><stop offset="1" stop-color="#ec8ffc"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7060ca" stop-opacity=".22"/><stop offset=".55" stop-color="#4840a4" stop-opacity=".08"/><stop offset="1" stop-color="#11111d" stop-opacity="0"/></radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34304a"/><stop offset="1" stop-color="#181823"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a5a2bf" opacity=".11"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1440" height="880" rx="26" fill="#10111a"/>
  <rect x="1" y="1" width="1438" height="878" rx="25" fill="url(#dots)" stroke="#34313f"/>
  <rect x="40" y="0" width="1360" height="3" rx="2" fill="url(#spectrum)"/>
  <ellipse cx="1090" cy="330" rx="420" ry="400" fill="url(#halo)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 69)"><circle cx="8" cy="0" r="6" fill="#b2f297"/><text x="27" y="5" fill="#bfc5c9" font-size="12" letter-spacing="3">LOCAL FIRST / OPEN SOURCE / INDEPENDENT</text></g>
    <text x="72" y="207" fill="#f1f2f7" font-size="101" font-weight="700" letter-spacing="-6">gem<tspan fill="url(#spectrum)">search</tspan><tspan fill="#626273" font-size="32" letter-spacing="0"> /</tspan></text>
    <text x="77" y="297" fill="#e5e5ee" font-size="54" font-weight="500" letter-spacing="-2">Let curiosity</text>
    <text x="76" y="370" fill="url(#spectrum)" font-size="79" font-weight="700" letter-spacing="-3">crawl.</text>
    <text x="79" y="427" fill="#a6a8ba" font-size="20">Your feed has a new inhabitant.</text>
    <text x="79" y="462" fill="#a6a8ba" font-size="20">A little spider with a research engine behind it.</text>
    <g transform="translate(78 504)"><rect width="160" height="40" rx="20" fill="#1d2523" stroke="#4f6951"/><circle cx="21" cy="20" r="4" fill="#a9ee98"/><text x="36" y="25" fill="#c4e6ba" font-size="12">RUNS ON YOUR PC</text><rect x="174" width="150" height="40" rx="20" fill="#252139" stroke="#534867"/><text x="194" y="25" fill="#cfc4ed" font-size="12">CHROME EXTENSION</text></g>
    <text x="79" y="596" fill="#696d83" font-size="11" letter-spacing="2">VISIBLE POSTS. TRACEABLE EVIDENCE. ROOM FOR DOUBT.</text>
  </g>
