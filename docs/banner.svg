  <g transform="translate(76 672)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1288" height="142" rx="18" fill="#161722" stroke="#333343"/>
    <path d="M326 27V116M646 27V116M966 27V116" stroke="#343443"/>
    <g transform="translate(29 30)"><text fill="#ed97b1" font-size="10" letter-spacing="2">01 / OBSERVE</text><text y="36" fill="#f1edf4" font-size="22" font-weight="600">Follow the feed</text><text y="63" fill="#8f90a6" font-size="13">A spider. Your tab. Your pace.</text></g>
    <g transform="translate(352 30)"><text fill="#f1cf8a" font-size="10" letter-spacing="2">02 / CONNECT</text><text y="36" fill="#f1edf4" font-size="22" font-weight="600">Find the narrative</text><text y="63" fill="#8f90a6" font-size="13">JEV turns repeats into leads.</text></g>
    <g transform="translate(672 30)"><text fill="#91e5c7" font-size="10" letter-spacing="2">03 / INVESTIGATE</text><text y="36" fill="#f1edf4" font-size="22" font-weight="600">Trace the evidence</text><text y="63" fill="#8f90a6" font-size="13">Crawler follows public links.</text></g>
    <g transform="translate(992 30)"><text fill="#b5a2ed" font-size="10" letter-spacing="2">04 / CHALLENGE</text><text y="36" fill="#f1edf4" font-size="22" font-weight="600">Ask four minds</text><text y="63" fill="#8f90a6" font-size="13">Grok reviews. You see why.</text></g>
  </g>
  <text x="720" y="851" fill="#5f6378" font-size="10" letter-spacing="3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A RESEARCH COMPANION - NOT A PROMISE OF RETURNS</text>
